name: Apply Kelvin-Voigt evaporation extension

on:
  push:
    branches:
      - fix-yarin-2001-evaporation
    paths:
      - "tools/apply_kv_evaporation_extension.py"
      - ".github/workflows/apply-kv-evaporation.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-yarin-2001-evaporation
      - name: Apply source and documentation changes
        run: python3 tools/apply_kv_evaporation_extension.py
      - name: Commit generated changes
        run: |
          rm -f tools/apply_kv_evaporation_extension.py
          rm -f .github/workflows/apply-kv-evaporation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add concentration-dependent Kelvin-Voigt evaporation"
          git push origin HEAD:fix-yarin-2001-evaporation
