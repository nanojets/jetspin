name: Fix Kelvin-Voigt evaporation build

on:
  push:
    branches:
      - fix-yarin-2001-evaporation
    paths:
      - "tools/fix_kv_evaporation_build.py"
      - ".github/workflows/fix-kv-evaporation-build.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-yarin-2001-evaporation
      - run: python3 tools/fix_kv_evaporation_build.py
      - run: |
          rm -f tools/fix_kv_evaporation_build.py
          rm -f .github/workflows/fix-kv-evaporation-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Kelvin-Voigt evaporation stress interface"
          git push origin HEAD:fix-yarin-2001-evaporation
