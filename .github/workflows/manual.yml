name: Build manual

on:
  push:
    paths:
      - "manual/**"
      - ".github/workflows/manual.yml"
  pull_request:
    paths:
      - "manual/**"
      - ".github/workflows/manual.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - name: Compile manual
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: manual
          root_file: manual.tex
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: jetspin-manual
          path: manual/manual.pdf
      - name: Refresh tracked PDF
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manual/manual.pdf
          if ! git diff --cached --quiet; then
            git commit -m "DOC: refresh compiled manual [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
