name: Smoke tests

on:
  push:
    paths:
      - "build/**"
      - "examples/**"
      - "source/**"
      - "tests/smoke/**"
      - ".github/workflows/smoke-tests.yml"
  pull_request:
    paths:
      - "build/**"
      - "examples/**"
      - "source/**"
      - "tests/smoke/**"
      - ".github/workflows/smoke-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      matrix:
        mode: [serial, debug, mpi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MPI
        if: matrix.mode == 'mpi'
        run: sudo apt-get update && sudo apt-get install -y openmpi-bin libopenmpi-dev
      - name: Run smoke tests
        run: tests/smoke/run.sh "${{ matrix.mode }}"
